# Gradle 守护进程 JVM 判据
#
# 为什么必须钉死 17/21：
#   Kotlin 2.0.0 编译器在 JDK 25 上会直接抛
#   `e: java.lang.IllegalArgumentException: 25.0.2` 并中止编译。
#
# 该文件由人工维护（等价于 `gradle updateDaemonJvm --jvm-version=17` 的产物）。
# 若本机没有 JDK 17，Gradle 会报 "No matching toolchains found"，此时请安装
# Temurin/Corretto 17 或改用 21 并同步修改下面的版本号。
toolchainVersion=17
